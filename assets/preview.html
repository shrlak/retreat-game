<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>빛의 원정대 에셋 미리보기</title><style>
body{margin:0;background:#1E2A4A url(./bg-pattern.svg);color:#FFF6E5;font-family:system-ui,sans-serif;padding:16px}
h2{font-size:16px;margin:28px 0 10px;color:#F8DC8B}
.row{display:flex;flex-wrap:wrap;gap:12px}
.card{position:relative;margin:0;width:160px} .card img{width:100%;display:block;filter:drop-shadow(0 6px 14px #0008)}
.nm{position:absolute;left:7.67%;top:83.33%;width:84.67%;height:12.38%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.nm.good{color:#4A3426} .nm.evil{color:#3A2550}
.tok{margin:0;width:84px;text-align:center;font-size:11px;opacity:.9} .tok img{width:72px;height:72px}
.bg{margin:0;width:150px;font-size:11px} .bg img{width:150px;height:300px;object-fit:cover;border-radius:12px}
.av{width:48px;height:48px} .ic{color:#F8DC8B;padding:6px} .ic img{width:24px;height:24px;filter:invert(86%) sepia(30%) saturate(600%) hue-rotate(-10deg)}
.track img{width:100%;max-width:560px;display:block;margin-bottom:8px}
</style></head><body>
<img src="./logo.svg" alt="빛의 원정대" style="width:280px;display:block;margin:8px auto">
<h2>역할 카드</h2><div class="row"><figure class="card"><img src="./roles/merlin.svg" alt=""><span class="nm good">선지자</span></figure><figure class="card"><img src="./roles/percival.svg" alt=""><span class="nm good">파수꾼</span></figure><figure class="card"><img src="./roles/servant.svg" alt=""><span class="nm good">빛의 일꾼</span></figure><figure class="card"><img src="./roles/assassin.svg" alt=""><span class="nm evil">정탐꾼</span></figure><figure class="card"><img src="./roles/morgana.svg" alt=""><span class="nm evil">거짓 선지자</span></figure><figure class="card"><img src="./roles/mordred.svg" alt=""><span class="nm evil">양의 탈을 쓴 늑대</span></figure><figure class="card"><img src="./roles/oberon.svg" alt=""><span class="nm evil">방황하는 자</span></figure><figure class="card"><img src="./roles/minion.svg" alt=""><span class="nm evil">유혹하는 자</span></figure><figure class="card"><img src="./card-back.svg" alt=""></figure></div>
<h2>토큰 · 투표 · 팀 · 정보</h2><div class="row"><figure class="tok"><img src="./token-success.svg" alt=""><figcaption>success</figcaption></figure><figure class="tok"><img src="./token-fail.svg" alt=""><figcaption>fail</figcaption></figure><figure class="tok"><img src="./vote-approve.svg" alt=""><figcaption>approve</figcaption></figure><figure class="tok"><img src="./vote-reject.svg" alt=""><figcaption>reject</figcaption></figure><figure class="tok"><img src="./leader.svg" alt=""><figcaption>leader</figcaption></figure><figure class="tok"><img src="./lady.svg" alt=""><figcaption>lady</figcaption></figure><figure class="tok"><img src="./team-good.svg" alt=""><figcaption>good</figcaption></figure><figure class="tok"><img src="./knowledge/evil.svg" alt=""><figcaption>evil</figcaption></figure><figure class="tok"><img src="./knowledge/merlin-candidate.svg" alt=""><figcaption>merlinCandidate</figcaption></figure><figure class="tok"><img src="./knowledge/unknown.svg" alt=""><figcaption>unknown</figcaption></figure><figure class="tok"><img src="./knowledge/target.svg" alt=""><figcaption>target</figcaption></figure></div>
<h2>트랙</h2><div class="track"><img src="./track/quest-board.svg" alt=""><img src="./track/vote-track.svg" alt=""></div>
<h2>배경</h2><div class="row"><figure class="bg"><img src="./backgrounds/home.svg" alt=""><figcaption>home</figcaption></figure><figure class="bg"><img src="./backgrounds/game.svg" alt=""><figcaption>game</figcaption></figure><figure class="bg"><img src="./backgrounds/reveal.svg" alt=""><figcaption>reveal</figcaption></figure><figure class="bg"><img src="./backgrounds/victory-good.svg" alt=""><figcaption>victoryGood</figcaption></figure><figure class="bg"><img src="./backgrounds/victory-evil.svg" alt=""><figcaption>victoryEvil</figcaption></figure><figure class="bg"><img src="./backgrounds/phase-propose.svg" alt=""><figcaption>propose</figcaption></figure><figure class="bg"><img src="./backgrounds/phase-vote.svg" alt=""><figcaption>vote</figcaption></figure><figure class="bg"><img src="./backgrounds/phase-mission.svg" alt=""><figcaption>mission</figcaption></figure><figure class="bg"><img src="./backgrounds/phase-lady.svg" alt=""><figcaption>lady</figcaption></figure><figure class="bg"><img src="./backgrounds/phase-assassin.svg" alt=""><figcaption>assassin</figcaption></figure><figure class="bg"><img src="./backgrounds/phase-wait.svg" alt=""><figcaption>wait</figcaption></figure><figure class="bg"><img src="./map/journey.svg" alt=""><figcaption>map</figcaption></figure></div>
<h2>아바타</h2><div class="row"><img class="av" src="./avatars/avatar-1.svg" alt=""><img class="av" src="./avatars/avatar-2.svg" alt=""><img class="av" src="./avatars/avatar-3.svg" alt=""><img class="av" src="./avatars/avatar-4.svg" alt=""><img class="av" src="./avatars/avatar-5.svg" alt=""><img class="av" src="./avatars/avatar-6.svg" alt=""><img class="av" src="./avatars/avatar-7.svg" alt=""><img class="av" src="./avatars/avatar-8.svg" alt=""><img class="av" src="./avatars/avatar-9.svg" alt=""><img class="av" src="./avatars/avatar-10.svg" alt=""></div>
<h2>아이콘</h2><div class="row"><span class="ic" title="check"><img src="./icons/check.svg" alt=""></span><span class="ic" title="clock"><img src="./icons/clock.svg" alt=""></span><span class="ic" title="copy"><img src="./icons/copy.svg" alt=""></span><span class="ic" title="dove"><img src="./icons/dove.svg" alt=""></span><span class="ic" title="exit"><img src="./icons/exit.svg" alt=""></span><span class="ic" title="eye-off"><img src="./icons/eye-off.svg" alt=""></span><span class="ic" title="eye"><img src="./icons/eye.svg" alt=""></span><span class="ic" title="flag"><img src="./icons/flag.svg" alt=""></span><span class="ic" title="help"><img src="./icons/help.svg" alt=""></span><span class="ic" title="home"><img src="./icons/home.svg" alt=""></span><span class="ic" title="info"><img src="./icons/info.svg" alt=""></span><span class="ic" title="lamp"><img src="./icons/lamp.svg" alt=""></span><span class="ic" title="olive-branch"><img src="./icons/olive-branch.svg" alt=""></span><span class="ic" title="play"><img src="./icons/play.svg" alt=""></span><span class="ic" title="refresh"><img src="./icons/refresh.svg" alt=""></span><span class="ic" title="scroll"><img src="./icons/scroll.svg" alt=""></span><span class="ic" title="settings"><img src="./icons/settings.svg" alt=""></span><span class="ic" title="share"><img src="./icons/share.svg" alt=""></span><span class="ic" title="sheep"><img src="./icons/sheep.svg" alt=""></span><span class="ic" title="shield"><img src="./icons/shield.svg" alt=""></span><span class="ic" title="star"><img src="./icons/star.svg" alt=""></span><span class="ic" title="user-minus"><img src="./icons/user-minus.svg" alt=""></span><span class="ic" title="user-plus"><img src="./icons/user-plus.svg" alt=""></span><span class="ic" title="users"><img src="./icons/users.svg" alt=""></span><span class="ic" title="volume-off"><img src="./icons/volume-off.svg" alt=""></span><span class="ic" title="volume-on"><img src="./icons/volume-on.svg" alt=""></span><span class="ic" title="wifi-off"><img src="./icons/wifi-off.svg" alt=""></span><span class="ic" title="x"><img src="./icons/x.svg" alt=""></span></div>
</body></html>
