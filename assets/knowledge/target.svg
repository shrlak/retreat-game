<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"  xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .tw{animation:tw 3.2s ease-in-out infinite}
  .tw2{animation:tw 4.6s ease-in-out infinite .8s}
  .tw3{animation:tw 2.6s ease-in-out infinite 1.6s}
  .fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.6s ease-in-out infinite}
  .glow{animation:gl 3.4s ease-in-out infinite}
  .drift{animation:dr 14s ease-in-out infinite alternate}
  .bob{transform-box:fill-box;transform-origin:50% 50%;animation:bob 5s ease-in-out infinite}
  .shim{animation:sh 7s ease-in-out infinite 1s}
  .spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 40s linear infinite}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes fl{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.94,1.07) rotate(-2deg)}65%{transform:scale(1.04,.95) rotate(2deg)}}
  @keyframes gl{0%,100%{opacity:.95}50%{opacity:.7}}
  @keyframes dr{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes sh{0%{transform:translateX(0) skewX(-18deg)}28%,100%{transform:translateX(1000px) skewX(-18deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.tw,.tw2,.tw3,.fl,.glow,.drift,.bob,.shim,.spin{animation:none}.shim{opacity:0}}
</style><defs><radialGradient id="kt_s" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#B48CE0" stop-opacity="0.0"/><stop offset="0.62" stop-color="#B48CE0" stop-opacity="0.08"/><stop offset="0.8" stop-color="#B48CE0" stop-opacity="0.35"/><stop offset="1" stop-color="#B48CE0" stop-opacity="0"/></radialGradient><linearGradient id="kt_r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4D6F5"/><stop offset="0.5" stop-color="#B48CE0"/><stop offset="1" stop-color="#7E57A6"/></linearGradient></defs><style>.kt_spin{transform-box:fill-box;transform-origin:50% 50%;animation:kt_spink 16s linear infinite}@keyframes kt_spink{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.kt_spin{animation:none}}</style><circle cx="100" cy="100" r="99" fill="url(#kt_s)" class="glow"/><circle cx="100" cy="100" r="80" fill="none" stroke="#3A2550" stroke-width="15" opacity=".55"/><circle cx="100" cy="100" r="80" fill="none" stroke="url(#kt_r)" stroke-width="12"/><circle cx="100" cy="100" r="72" fill="none" stroke="#E4D6F5" stroke-width="2" opacity=".85"/><circle cx="100" cy="100" r="88" fill="none" stroke="#7E57A6" stroke-width="2.5"/><path d="M48,66 A60,60 0 0,1 78,40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".7"/><path d="M44,84 A60,60 0 0,1 46,76" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".6"/><g transform="translate(100,100)"><g class="kt_spin"><path d="M62.2,-73.2 Q64.6,-64.6 73.2,-62.2 Q64.6,-59.8 62.2,-51.2 Q59.8,-59.8 51.2,-62.2 Q59.8,-64.6 62.2,-73.2 Z" fill="#F3E9FB" class=""/><path d="M-62.2,51.2 Q-59.8,59.8 -51.2,62.2 Q-59.8,64.6 -62.2,73.2 Q-64.6,64.6 -73.2,62.2 Q-64.6,59.8 -62.2,51.2 Z" fill="#F3E9FB" class=""/></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
